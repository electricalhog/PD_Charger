[project]
name = "bringup-mcp"
version = "0.1.3"
description = "MCP server that fronts the PD_Charger bring-up CLI (tools/bringup/bu) for a remote agent, with a bench interlock"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2,<3",
    "uvicorn>=0.30",
]

[project.scripts]
bringup-mcp = "bringup_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8", "anyio>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bringup_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
