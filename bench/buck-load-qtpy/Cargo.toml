[package]
name = "buck-load-qtpy"
version = "0.2.0"
edition = "2024"
description = "Buck converter as a power-target load, QT Py RP2040, commanded by the bench PD sink over I2C"
license = "MIT"
publish = false

# Same embassy commit as bench/pd-sink-g431.
[dependencies]
embassy-rp = { git = "https://github.com/embassy-rs/embassy", rev = "930269e92e70b4a1d647bb8a14610d1a01763a5e", features = [
    "rp2040",
    "time-driver",
    "critical-section-impl",
    "unstable-pac",
] }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "930269e92e70b4a1d647bb8a14610d1a01763a5e" }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "930269e92e70b4a1d647bb8a14610d1a01763a5e", features = [
    "arch-cortex-m",
    "executor-thread",
] }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "930269e92e70b4a1d647bb8a14610d1a01763a5e" }
embassy-usb = { git = "https://github.com/embassy-rs/embassy", rev = "930269e92e70b4a1d647bb8a14610d1a01763a5e", default-features = false }
embassy-futures = { git = "https://github.com/embassy-rs/embassy", rev = "930269e92e70b4a1d647bb8a14610d1a01763a5e" }
static_cell = "2"
# thumbv6m has no CAS: static_cell needs the critical-section backend.
portable-atomic = { version = "1", features = ["critical-section"] }
cortex-m = { version = "0.7.6", features = ["inline-asm"] }
cortex-m-rt = "0.7"
load-link = { path = "../load-link" }
load-control = { path = "../load-control" }

[features]
# Switch phase 2 of the buck (src/board.rs).  Without it every gate pin is
# held off (DISABLE high, PWM low) for the life of the program and the load
# reports no_power_stage; the I2C link, ADC telemetry and USB console work
# either way.
power-stage = []

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"

[profile.dev]
opt-level = "s"
