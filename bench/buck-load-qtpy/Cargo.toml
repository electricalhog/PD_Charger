[package]
name = "buck-load-qtpy"
version = "0.1.0"
edition = "2024"
description = "Buck converter as a power-target load, QT Py RP2040, commanded by the bench PD sink over I2C"
license = "MIT"
publish = false

# Same embassy commit as bench/pd-sink-g431.
[dependencies]
embassy-rp = { git = "https://github.com/embassy-rs/embassy", rev = "930269e92e70b4a1d647bb8a14610d1a01763a5e", features = [
    "rp2040",
    "time-driver",
    "critical-section-impl",
    "unstable-pac",
] }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "930269e92e70b4a1d647bb8a14610d1a01763a5e" }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "930269e92e70b4a1d647bb8a14610d1a01763a5e", features = [
    "arch-cortex-m",
    "executor-thread",
] }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "930269e92e70b4a1d647bb8a14610d1a01763a5e" }
cortex-m = { version = "0.7.6", features = ["inline-asm"] }
cortex-m-rt = "0.7"
panic-halt = "1.0"
load-link = { path = "../load-link" }
load-control = { path = "../load-control" }

[features]
# Drive the gate-driver pins.  Off by default: the QT Py-to-buck pin map in
# src/board.rs is an assumption until checked against the wiring; without
# this feature no PWM or DISABLE pin is touched and the load reports
# no_power_stage (I2C link and ADC telemetry still work).
power-stage = []

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"

[profile.dev]
opt-level = "s"
