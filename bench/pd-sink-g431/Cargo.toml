[package]
name = "pd-sink-g431"
version = "0.1.0"
edition = "2024"
description = "Scriptable USB-PD (SPR + EPR) sink for the PD_Charger bench, NUCLEO-G431RB"
license = "MIT"
publish = false

# embassy and usbpd are pinned to the commits elagil/usbpd's
# examples/embassy-stm32-g431cb-epr builds against (usbpd 72008c4, its
# embassy submodule 930269e).  Bump them together.
[dependencies]
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy", rev = "930269e92e70b4a1d647bb8a14610d1a01763a5e", features = [
    "stm32g431rb",
    "time-driver-any",
    "memory-x",
    "unstable-pac",
    "exti",
] }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "930269e92e70b4a1d647bb8a14610d1a01763a5e" }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "930269e92e70b4a1d647bb8a14610d1a01763a5e", features = [
    "arch-cortex-m",
    "executor-thread",
] }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "930269e92e70b4a1d647bb8a14610d1a01763a5e", features = [
    "tick-hz-100_000",
] }
embassy-futures = { git = "https://github.com/embassy-rs/embassy", rev = "930269e92e70b4a1d647bb8a14610d1a01763a5e" }
usbpd = { git = "https://github.com/elagil/usbpd", rev = "72008c424eeebd0ea271eb5794ff000b3832a134" }
usbpd-traits = { git = "https://github.com/elagil/usbpd", rev = "72008c424eeebd0ea271eb5794ff000b3832a134" }

cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
panic-halt = "1.0"
static_cell = "2.1.1"
embedded-io-async = "0.7.0"
heapless = { version = "0.9.1", default-features = false }
uom = { version = "0.36.0", default-features = false, features = ["si"] }

[profile.dev]
codegen-units = 1
debug = 2
opt-level = "s"
overflow-checks = true

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
